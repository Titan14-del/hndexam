<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="HND Software Engineering past exam papers with model answers, course notes, and study-by-topic tools.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
<meta property="og:title" content="HND Software Engineering Exam Hub">
<meta property="og:description" content="Past exam papers with model answers, course notes, and study-by-topic tools for HND Software Engineering students.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://titan14-del.github.io/hndexam/">
<title>HND Software Engineering Exam Hub</title>
<style>
#loading-spinner {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 80px 20px; text-align: center;
}
.spinner {
  width: 40px; height: 40px; border: 4px solid var(--border,#e2e8f0);
  border-top-color: var(--primary,#3b82f6); border-radius: 50%;
  animation: spin 0.8s linear infinite; margin-bottom: 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }
#loading-spinner p { color: var(--text-muted,#64748b); font-family: sans-serif; margin: 0; }
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128218;</text></svg>">
<link rel="stylesheet" href="css/prism.css?v=7">
<link rel="stylesheet" href="css/style.css?v=12">
<link rel="stylesheet" href="css/print.css?v=7">
</head>
<body>
<noscript><div style="padding:40px;text-align:center;font-family:sans-serif"><h1>JavaScript Required</h1><p>This site requires JavaScript to function. Please enable it in your browser settings.</p></div></noscript>

<header>
  <div class="container">
    <a href="#" class="logo" onclick="navigateTo('home')">HND <span>Exam Hub</span></a>
    <nav id="mainNav" class="main-nav"></nav>
    <div class="header-controls">
      <button class="hamburger" onclick="toggleMobileNav()" title="Menu">&#9776;</button>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search exams &amp; notes..." oninput="debouncedSearch(this.value)">
        <span class="icon">&#128269;</span>
      </div>
      <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">&#9790;</button>
    </div>
  </div>
</header>

<main>
  <div class="container" id="app">
    <div id="loading-spinner">
      <div class="spinner"></div>
      <p>Loading...</p>
    </div>
  </div>
</main>

<script src="js/data.js?v=18"></script>
<script src="js/notes-year1.js?v=7"></script>
<script src="js/notes-year2.js?v=7"></script>
<script src="js/notes.js?v=7"></script>
<script src="js/prism.js?v=7"></script>
<script src="js/study.js?v=8"></script>
<script src="js/app.js?v=13"></script>
<script async src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
</body>
</html>
