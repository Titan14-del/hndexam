<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HND Software Engineering Exam Hub</title>
<link rel="stylesheet" href="css/prism.css?v=1">
<link rel="stylesheet" href="css/style.css?v=1">
<link rel="stylesheet" href="css/print.css?v=1">
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
</head>
<body>

<header>
  <div class="container">
    <a href="#" class="logo" onclick="navigateTo('home')">HND <span>Exam Hub</span></a>
    <nav id="mainNav" class="main-nav"></nav>
    <div class="header-controls">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search exams &amp; notes..." oninput="debouncedSearch(this.value)">
        <span class="icon">&#128269;</span>
      </div>
      <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">&#9790;</button>
    </div>
  </div>
</header>

<main>
  <div class="container" id="app"></div>
</main>

<script src="js/data.js?v=1"></script>
<script src="js/notes-year1.js?v=1"></script>
<script src="js/notes-year2.js?v=1"></script>
<script src="js/notes.js?v=1"></script>
<script src="js/prism.js?v=1"></script>
<script src="js/app.js?v=1"></script>
</body>
</html>
